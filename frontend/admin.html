<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUITBANKER | Admin Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: #0a0a0a; color: #fff; }
        
        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: rgba(0,0,0,0.95);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 30px 20px;
            z-index: 100;
        }
        .sidebar-logo { text-align: center; margin-bottom: 40px; }
        .sidebar-logo h2 { font-size: 28px; letter-spacing: -1px; }
        .sidebar-logo p { font-size: 11px; opacity: 0.5; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 10px; }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 18px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .sidebar-menu a i { width: 24px; }
        
        /* Main Content */
        .main-content { margin-left: 280px; padding: 30px; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logout-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-value { font-size: 32px; font-weight: 700; color: #10b981; }
        .stat-label { font-size: 12px; opacity: 0.6; margin-top: 8px; }
        
        /* Tabs */
        .tabs { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab {
            padding: 8px 22px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .tab.active { background: #10b981; color: #000; }
        
        /* Tables */
        .table-wrapper { overflow-x: auto; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #10b981; font-size: 12px; }
        td { font-size: 13px; }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
        }
        .badge-admin { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        .badge-user { background: rgba(16,185,129,0.2); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
        .btn-danger {
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.3);
            padding: 5px 12px;
            border-radius: 6px;
            color: #f87171;
            cursor: pointer;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .menu-toggle {
                position: fixed;
                bottom: 20px;
                left: 20px;
                background: #10b981;
                padding: 12px;
                border-radius: 50%;
                cursor: pointer;
                z-index: 200;
            }
        }
        @media (min-width: 769px) { .menu-toggle { display: none; } }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.9);
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 3px solid #10b981;
            animation: slide 0.3s ease;
            z-index: 1000;
        }
        @keyframes slide {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <h2>NUITBANKER</h2>
        <p>SECURE CONSOLE</p>
    </div>
    <ul class="sidebar-menu">
        <li><a data-tab="dashboard" class="active"><i class="fas fa-chart-line"></i> Dashboard</a></li>
        <li><a data-tab="users"><i class="fas fa-users"></i> Usuários</a></li>
        <li><a data-tab="logs"><i class="fas fa-history"></i> Logs Acesso</a></li>
    </ul>
</aside>

<main class="main-content">
    <div class="admin-header">
        <h1>NUITBANKER <span style="color:#10b981">v1</span></h1>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> SAIR</button>
    </div>

    <div id="tabDashboard" class="tab-content active">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="statUsers">0</div><div class="stat-label">Total Usuários</div></div>
            <div class="stat-card"><div class="stat-value" id="statAdmins">0</div><div class="stat-label">Administradores</div></div>
            <div class="stat-card"><div class="stat-value" id="statLogs">0</div><div class="stat-label">Total Acessos</div></div>
            <div class="stat-card"><div class="stat-value" id="statLogsHoje">0</div><div class="stat-label">Acessos Hoje</div></div>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('users')">USUÁRIOS</div>
            <div class="tab" onclick="switchTab('logs')">LOGS DE ACESSO</div>
        </div>

        <div id="tabUsersContent" class="tab-content active">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Nome</th><th>CPF</th><th>Email</th><th>Cargo</th><th>IP</th><th>Dispositivo</th><th>Último Acesso</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="usersTable"><tr><td colspan="9">Carregando...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div id="tabLogsContent" class="tab-content">
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>ID</th><th>CPF</th><th>IP</th><th>Dispositivo</th><th>Navegador</th><th>Data/Hora</th></tr></thead>
                    <tbody id="logsTable"><tr><td colspan="6">Carregando...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    const API_URL = 'https://seu-backend.onrender.com/api';
    let adminToken = localStorage.getItem('adminToken');
    let refreshInterval = null;

    async function verificarLogin() {
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!adminToken || user.role !== 'admin') {
            window.location.href = 'index.html';
        }
    }
    verificarLogin();

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas fa-check-circle" style="color:#10b981"></i> ${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('tabUsersContent').classList.remove('active');
        document.getElementById('tabLogsContent').classList.remove('active');
        document.getElementById(`tab${tabName.charAt(0).toUpperCase() + tabName.slice(1)}Content`).classList.add('active');
    }

    async function loadStats() {
        try {
            const res = await fetch(`${API_URL}/admin/stats`, {
                headers: { 'Authorization': `Bearer ${adminToken}` }
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('statUsers').innerText = data.stats.total_users;
                document.getElementById('statAdmins').innerText = data.stats.total_admins;
                document.getElementById('statLogs').innerText = data.stats.total_logs;
                document.getElementById('statLogsHoje').innerText = data.stats.logs_hoje;
            }
        } catch (error) { console.error(error); }
    }

    async function loadUsers() {
        try {
            const res = await fetch(`${API_URL}/admin/users`, {
                headers: { 'Authorization': `Bearer ${adminToken}` }
            });
            const users = await res.json();
            const tbody = document.getElementById('usersTable');
            if (!users.length) { tbody.innerHTML = '<tr><td colspan="9">Nenhum usuário</td></tr>'; return; }
            
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.nome || '-'}</td>
                    <td>${formatarCPF(u.cpf)}</td>
                    <td>${u.email || '-'}</td>
                    <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role === 'admin' ? 'Admin' : 'User'}</span></td>
                    <td><code>${u.ip || '-'}</code></td>
                    <td>${u.dispositivo || '-'}<br><small>${u.navegador || ''}</small></td>
                    <td>${u.ultimo_acesso ? new Date(u.ultimo_acesso).toLocaleString() : '-'}</td>
                    <td>${u.role !== 'admin' ? `<button class="btn-danger" onclick="deleteUser(${u.id})">Excluir</button>` : '-'}</td>
                </tr>
            `).join('');
        } catch (error) { console.error(error); }
    }

    async function deleteUser(id) {
        if (!confirm('Excluir este usuário?')) return;
        try {
            const res = await fetch(`${API_URL}/admin/users/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${adminToken}` }
            });
            if (res.ok) {
                showToast('Usuário excluído');
                loadUsers();
                loadStats();
            }
        } catch (error) { showToast('Erro ao excluir'); }
    }

    async function loadLogs() {
        try {
            const res = await fetch(`${API_URL}/admin/logs`, {
                headers: { 'Authorization': `Bearer ${adminToken}` }
            });
            const logs = await res.json();
            const tbody = document.getElementById('logsTable');
            if (!logs.length) { tbody.innerHTML = '<tr><td colspan="6">Nenhum log</td></tr>'; return; }
            
            tbody.innerHTML = logs.map(log => `
                <tr>
                    <td>${log.id}</td>
                    <td>${formatarCPF(log.cpf)}</td>
                    <td><code>${log.ip || '-'}</code></td>
                    <td>${log.dispositivo || '-'}</td>
                    <td>${log.navegador || '-'}</td>
                    <td>${new Date(log.data_acesso).toLocaleString()}</td>
                </tr>
            `).join('');
        } catch (error) { console.error(error); }
    }

    function formatarCPF(cpf) {
        if (!cpf) return '-';
        cpf = cpf.toString();
        if (cpf.length === 11) return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        return cpf;
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'index.html';
    }

    async function loadAll() {
        await loadStats();
        await loadUsers();
        await loadLogs();
    }

    loadAll();
    refreshInterval = setInterval(loadAll, 15000);
</script>
</body>
</html>
